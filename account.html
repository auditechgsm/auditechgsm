<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account - AUDITECH GSM</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="site-header"></div>
<div class="pagehead"><div class="container">
  <div class="crumb"><a href="index.html">Home</a> / My Account</div>
  <h1>My Account</h1>
  <p id="who"></p>
</div></div>
<main class="container">
  <div id="gate" class="panel" style="display:none">Please <a href="#" data-open="auth" style="text-decoration:underline;font-weight:700">log in</a> to view your account.</div>
  <div id="content" style="display:none">
    <div class="panel">
      <h2>Balance</h2>
      <p style="font-size:28px;font-weight:900;margin:0" id="bal"></p>
      <p style="margin:6px 0 12px;color:var(--muted)" id="tier"></p>
      <a class="btn btn-primary" href="add-credit.html">Add credit</a>
    </div>
    <div class="panel">
      <h2>My orders</h2>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>#</th><th>Date</th><th>Service</th><th>Price</th><th>Status</th><th>Result / note</th></tr></thead>
      <tbody id="orderRows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div>
    </div>
    <div class="panel">
      <h2>Credit history</h2>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance after</th><th>Note</th></tr></thead>
      <tbody id="ledgerRows"><tr><td colspan="5">Loading…</td></tr></tbody></table></div>
    </div>
  </div>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="services.js"></script>
<script src="backend.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var gate = document.getElementById("gate"), content = document.getElementById("content");
  function load() {
    AT.sb.from("orders").select("*").order("created_at", { ascending: false }).limit(100).then(function (r) {
      var tb = document.getElementById("orderRows");
      if (r.error) { tb.innerHTML = '<tr><td colspan="6">' + AT.esc(r.error.message) + '</td></tr>'; return; }
      tb.innerHTML = r.data.length ? r.data.map(function (o) {
        return '<tr><td>' + o.id + '</td><td>' + new Date(o.created_at).toLocaleString() + '</td><td>' + AT.esc(o.service_name) + (o.qty > 1 ? ' <b>x' + o.qty + '</b>' : '') +
          '</td><td>' + AT.money(o.price) + '</td><td><span class="st st-' + o.status + '">' + o.status + '</span></td><td style="white-space:pre-wrap">' +
          AT.esc(o.admin_response || '') + '</td></tr>';
      }).join("") : '<tr><td colspan="6">No orders yet.</td></tr>';
    });
    AT.sb.from("credit_ledger").select("*").order("created_at", { ascending: false }).limit(100).then(function (r) {
      var tb = document.getElementById("ledgerRows");
      if (r.error) { tb.innerHTML = '<tr><td colspan="5">' + AT.esc(r.error.message) + '</td></tr>'; return; }
      tb.innerHTML = r.data.length ? r.data.map(function (l) {
        return '<tr><td>' + new Date(l.created_at).toLocaleString() + '</td><td>' + AT.esc(l.kind) + '</td><td style="color:' +
          (l.amount < 0 ? '#b91c1c' : '#047857') + '">' + (l.amount > 0 ? '+' : '') + AT.money(l.amount) + '</td><td>' + AT.money(l.balance_after) +
          '</td><td>' + AT.esc(l.note || '') + '</td></tr>';
      }).join("") : '<tr><td colspan="5">No activity yet.</td></tr>';
    });
  }
  function show() {
    if (!AT.configured) { gate.style.display = "block"; gate.textContent = "The backend is not connected yet. Add your Supabase keys in config.js."; return; }
    var p = AT.profile;
    gate.style.display = p ? "none" : "block";
    content.style.display = p ? "block" : "none";
    if (!p) return;
    document.getElementById("who").textContent = (p.full_name || "") + " " + p.email;
    document.getElementById("bal").textContent = AT.money(p.balance) + " USD";
    document.getElementById("tier").textContent = "Membership: " + p.tier;
    load();
  }
  AT.ready.then(show); AT.onChange(show);
})();
</script>
</body>
</html>
